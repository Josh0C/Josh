<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="brand">♥ LOVE LOVE</span>
    <a href="Loading page.html">Home</a>
    <a href="Profile.html">Profile</a>
    <a href="my hobbies.html">Hobbies</a>
    <a href="login.html" class="active" id="authLink">Login</a>
  </nav>

  <main>
    <div class="box narrow">
      <h1>Login</h1>
      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" name="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <button type="submit">Log in</button>
        <p class="error" id="errorMsg">Incorrect username or password.</p>
      </form>
      <p class="hint">Hint: username <strong>meandyou</strong>, password <strong>1234</strong></p>
    </div>
  </main>

    <footer>&copy; 2026 LOVE LOVE</footer>

  <script>
    var authLink = document.getElementById('authLink');
    var user = sessionStorage.getItem('user');
    if (user) {
      authLink.textContent = 'Logout';
      authLink.href = '#';
      authLink.onclick = function () {
        sessionStorage.removeItem('user');
        window.location.href = 'login.html';
      };
    }

  
    var validUsername = "meandyou";
    var validPassword = "1234";

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      if (username === validUsername && password === validPassword) {
        sessionStorage.setItem('user', username);
        window.location.href = 'Profile.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
