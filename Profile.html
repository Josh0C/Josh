<!DOCTYPE html>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f4f2;
      color: #222;
    }
    nav {
      background-color: #2f6f4f;
      padding: 1rem 2rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-right: 1.5rem;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #cfe4d7;
      flex-shrink: 0;
    }
    h1 {
      color: #1f4e3d;
      margin: 0;
    }
    .role {
      color: #5a5a5a;
      margin: 0.2rem 0 0;
    }
    h2 {
      color: #2f6f4f;
      margin-top: 1.5rem;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 0.4rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    .info-box {
      background-color: #f0f4f2;
      padding: 0.8rem 1rem;
      border-radius: 6px;
    }
    .info-box strong {
      display: block;
      color: #1f4e3d;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }
    .tags {
      margin-top: 0.5rem;
    }
    .tag {
      display: inline-block;
      background-color: #e4efe8;
      color: #1f4e3d;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
      margin: 0.2rem 0.4rem 0.2rem 0;
    }
  </style>
</head>
