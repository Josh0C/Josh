<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobbies Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="brand">♥ LOVE LOVE</span>
    <a href="Loading page.html">Home</a>
    <a href="Profile.html">Profile</a>
    <a href="my hobbies.html" class="active">Hobbies</a>
    <a href="login.html" id="authLink">Login</a>
  </nav>

  <main>
    <div class="box">
      <h1>Hobbies</h1>
      <p>Things I enjoy doing.</p>

      <div class="cols">
        <div class="col">
          <h2>Unordered list</h2>
          <ul>
            <li>Add your hobby</li>
            <li>Add your hobby</li>
            <li>Add your hobby</li>
          </ul>
        </div>
        <div class="col">
          <h2>Numbered list</h2>
          <ol>
            <li>Add your hobby</li>
            <li>Add your hobby</li>
            <li>Add your hobby</li>
          </ol>
        </div>
      </div>

      <a href="Profile.html" class="next">&larr; Back to profile</a>
    </div>
  </main>

  <footer>&copy; 2026 LOVE LOVE</footer>

  <script>
    var authLink = document.getElementById('authLink');
    var user = sessionStorage.getItem('user');
    if (user) {
      authLink.textContent = 'Logout';
      authLink.href = '#';
      authLink.onclick = function () {
        sessionStorage.removeItem('user');
        window.location.href = 'login.html';
      };
    }
  </script>
</body>
</html>
